<h3 class="text-sm text-slate-400">{{ labels.triage_questionnaire }}</h3>
<div class="mt-2 text-sm">
  <div class="flex justify-between mb-1">
    <span>{{ itq.answered }} / {{ itq.total }} answered</span>
    <span class="text-slate-500">{{ itq.pct }}%</span>
  </div>
  <div class="w-full bg-slate-800 rounded h-2 overflow-hidden">
    <div class="bg-amber-500 h-2" style="width: {{ itq.pct }}%"></div>
  </div>
</div>
