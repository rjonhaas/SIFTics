<h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Authority Gates</h3>
<p class="text-2xl mt-1 {% if pending_gate_count %}text-orange-400{% else %}text-slate-500{% endif %}">
  {{ pending_gate_count }}
</p>
<p class="text-xs text-slate-500">
  {%- if pending_gate_count == 0 -%}
    no pending decisions
  {%- elif pending_gate_count == 1 -%}
    pending decision
  {%- else -%}
    pending decisions
  {%- endif -%}
</p>
