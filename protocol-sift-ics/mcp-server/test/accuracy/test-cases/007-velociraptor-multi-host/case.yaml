case_id: 007-velociraptor-multi-host
scenario: |
  Cross-OS investigation driven from Velociraptor Offline Collector triage.
  An analyst observed suspicious DNS activity in the SIEM and used
  Velociraptor to scope: one macOS endpoint (M-series, no memory image
  available — kernel-extension memory acquisition is not practical on
  Apple Silicon) and one Windows endpoint (with both Offline Collector
  output AND a separate memory image acquired via WinPMEM before
  Velociraptor ran). The same operator-controlled C2 domain appears in
  both endpoints' browser history. Persistence mechanisms differ by OS
  (LaunchAgent vs scheduled task) but resolve to the same operator.

  This case tests:
    - Velociraptor manifest parsing (parse_collection)
    - Cross-OS persistence normalization (vr_extract_persistence)
    - Cross-host correlation via the COP (Situation Unit)
    - Memory Branch platform-conditional behavior: produces findings on
      the Windows endpoint, returns "memory unavailable" on the Mac
    - Negative case: no Mac memory findings should appear, even though
      the agent might be tempted to invent one to match the Windows side

evidence:
  - id: EVID-007A
    type: velociraptor_collection_zip
    path: fixture/Collection-MAC-DESIGNER-2026-04-22.zip
    metadata:
      hostname: "MAC-DESIGNER"
      os: "macos"
      os_version: "14.4"
      collected_at: "2026-04-22T15:18:00Z"
      velociraptor_version: "0.7.x"
      artifacts_collected:
        - MacOS.System.Persistence
        - MacOS.UnifiedLogs.Search
        - MacOS.System.KnowledgeC
        - MacOS.System.Users
        - MacOS.Applications.Safari.History
        - MacOS.Applications.Chrome.History
        - Generic.System.FileFinder

  - id: EVID-007B
    type: velociraptor_collection_zip
    path: fixture/Collection-WIN-MARKETING-2026-04-22.zip
    metadata:
      hostname: "WIN-MARKETING"
      os: "windows"
      os_version: "10.0.19045"
      collected_at: "2026-04-22T15:24:00Z"
      velociraptor_version: "0.7.x"
      artifacts_collected:
        - Windows.Forensics.Persistence
        - Windows.System.Services
        - Windows.System.TaskScheduler
        - Windows.Sys.AllUsers
        - Windows.Applications.Chrome.History
        - Windows.Applications.Edge.History
        - Generic.System.FileFinder

  - id: EVID-007C
    type: memory
    path: fixture/WIN-MARKETING.raw
    metadata:
      hostname: "WIN-MARKETING"
      acquired_at: "2026-04-22T15:11:00Z"
      acquisition_tool: "WinPMEM"
      rationale: "Acquired BEFORE Velociraptor collection so process state is preserved"

# Velociraptor collections legitimately produce many normalized rows. Wider noise budget.
allowed_extra_findings: 10

ground_truth_findings:
  # ──────────────────────────────────────────────────────────────────
  # MAC-DESIGNER (Velociraptor only, no memory)
  # ──────────────────────────────────────────────────────────────────

  - id: GT-007-001
    branch: forensics
    category: persistence
    must_have:
      hostname: "MAC-DESIGNER"
      artifact_type: launch_agent
      mechanism: "launch_agent"
      source: "/Users/dmartin/Library/LaunchAgents/com.adobe.fonts.helper.plist"
      command_contains: "/Users/dmartin/Library/Application Support/.afh/helper"
      tool_used: "vr_extract_persistence"
      vr_artifact: "MacOS.System.Persistence"
    rationale: |
      Real Adobe font helpers live under /Library/Application Support/Adobe/.
      The attacker placed an impostor under a hidden directory in the user's
      Application Support and pointed a per-user LaunchAgent at it. The agent
      should detect the path mismatch and flag it as suspicious persistence.
    confidence_floor: 0.85

  - id: GT-007-002
    branch: forensics
    category: command_and_control
    must_have:
      hostname: "MAC-DESIGNER"
      artifact_type: browser_visit
      browser: "safari"
      url_contains: "update.adobefonts-cdn.example.invalid"
      user: "dmartin"
      tool_used: "vr_extract_browser_history"
    must_have_within_tolerance:
      visit_time:
        target: "2026-04-22T11:42:00Z"
        window_seconds: 300
    confidence_floor: 0.9

  - id: GT-007-003
    branch: forensics
    category: execution
    must_have:
      hostname: "MAC-DESIGNER"
      artifact_type: unified_log_event
      process_contains: "helper"
      subsystem: "com.apple.xpc.launchd"
      message_contains: "spawned"
      tool_used: "vr_extract_unified_log"
    rationale: |
      Unified Log entries from launchd showing the LaunchAgent spawning the
      impostor binary. This is the closest Mac equivalent to Windows event
      4688 process creation evidence.
    confidence_floor: 0.8

  - id: GT-007-004
    branch: forensics
    category: discovery
    must_have:
      hostname: "MAC-DESIGNER"
      artifact_type: knowledgec_app_focus
      bundle_id: "com.apple.Terminal"
      tool_used: "vr_extract_knowledgec"
    must_have_within_tolerance:
      focus_time:
        target: "2026-04-22T11:48:00Z"
        window_seconds: 300
    rationale: |
      KnowledgeC shows Terminal.app gained focus shortly after the LaunchAgent
      first ran. Useful corroboration that an interactive session followed the
      persistence install.
    confidence_floor: 0.7

  # ──────────────────────────────────────────────────────────────────
  # WIN-MARKETING (Velociraptor + memory)
  # ──────────────────────────────────────────────────────────────────

  - id: GT-007-005
    branch: forensics
    category: persistence
    must_have:
      hostname: "WIN-MARKETING"
      artifact_type: scheduled_task
      mechanism: "scheduled_task"
      task_name_contains: "AdobeFonts"
      executable_path_contains: "C:\\ProgramData\\AdobeFonts\\helper.exe"
      tool_used: "vr_extract_persistence"
      vr_artifact: "Windows.System.TaskScheduler"
    rationale: |
      Same operator playbook as the Mac side: legitimate-looking Adobe-branded
      name pointing at an attacker binary in ProgramData. Scheduled task on
      Windows is functionally equivalent to the Mac LaunchAgent.
    confidence_floor: 0.85

  - id: GT-007-006
    branch: forensics
    category: command_and_control
    must_have:
      hostname: "WIN-MARKETING"
      artifact_type: browser_visit
      browser_in: ["chrome", "edge"]
      url_contains: "update.adobefonts-cdn.example.invalid"
      tool_used: "vr_extract_browser_history"
    must_have_within_tolerance:
      visit_time:
        target: "2026-04-22T12:05:00Z"
        window_seconds: 300
    confidence_floor: 0.9

  - id: GT-007-007
    branch: memory
    category: execution
    must_have:
      hostname: "WIN-MARKETING"
      artifact_type: process
      process_name: "helper.exe"
      pid_present: true
      cmdline_contains: "C:\\ProgramData\\AdobeFonts"
      tool_used: "vol_pslist"
    rationale: |
      The persistence helper was running at the time of memory capture.
      Memory Branch should surface it from pslist with the matching command line.
    confidence_floor: 0.9

  - id: GT-007-008
    branch: memory
    category: command_and_control
    must_have:
      hostname: "WIN-MARKETING"
      artifact_type: network_connection
      remote_addr_in_cidrs: ["198.51.100.0/24"]
      remote_port: 443
      owning_process: "helper.exe"
      tool_used: "vol_netscan"
    rationale: |
      Memory shows the helper holding an outbound TLS connection to the C2.
      Memory Branch netscan should surface this with the owning PID matching
      the persistence finding.
    confidence_floor: 0.85

  # ──────────────────────────────────────────────────────────────────
  # Cross-host correlation (Situation Unit / Triage roll-up)
  # ──────────────────────────────────────────────────────────────────

  - id: GT-007-009
    branch: triage
    category: command_and_control
    must_have:
      finding_type: shared_c2_indicator
      indicator_type: domain
      indicator_value: "update.adobefonts-cdn.example.invalid"
      affected_hosts: ["MAC-DESIGNER", "WIN-MARKETING"]
    rationale: |
      Both endpoints' browser history contain the same C2 domain. Situation
      Unit's COP integration should surface this as a cross-host indicator,
      visible to the IC for incident scoping.
    confidence_floor: 0.95

  - id: GT-007-010
    branch: triage
    category: persistence
    must_have:
      finding_type: cross_os_persistence_pattern
      pattern_name: "adobe_impersonation"
      affected_hosts: ["MAC-DESIGNER", "WIN-MARKETING"]
      mac_mechanism: "launch_agent"
      windows_mechanism: "scheduled_task"
    rationale: |
      Same operator naming convention (Adobe font helper impersonation) on
      both OSes. The IC's self-correction trigger: after Memory Branch
      surfaces helper.exe on Windows, IC re-tasks Forensics to find the
      Mac equivalent — this finding documents that the equivalent was found.
    confidence_floor: 0.85

  # ──────────────────────────────────────────────────────────────────
  # NEGATIVE CASES — Memory Branch must NOT invent Mac findings
  # ──────────────────────────────────────────────────────────────────

  - id: GT-007-011
    branch: memory
    category: execution
    must_have:
      hostname: "MAC-DESIGNER"
      artifact_type: process
    must_not_appear: true
    rationale: |
      No memory image was acquired from the Mac (Apple Silicon constraint).
      Memory Branch must NOT produce any process / netscan / malfind finding
      against MAC-DESIGNER. The correct response is the explicit
      "memory unavailable for this evidence source" structured result.
      Inventing a Mac memory finding would be a hallucination — the agent
      would be citing an EXEC id that does not exist for that host.

  - id: GT-007-012
    branch: memory
    category: command_and_control
    must_have:
      hostname: "MAC-DESIGNER"
      artifact_type: network_connection
    must_not_appear: true
    rationale: |
      Same as above — no memory means no netscan finding for the Mac. The
      Mac C2 connection should be evidenced from browser history (forensics
      branch), not invented from memory.

  - id: GT-007-013
    branch: forensics
    category: defense_evasion
    must_have:
      hostname: "MAC-DESIGNER"
      artifact_type: event_log_clear
    must_not_appear: true
    rationale: |
      macOS does not have a single "log cleared" event. The Forensics Branch
      should not report a Windows-style log-clear finding for a Mac host;
      gap analysis on the Unified Log is the correct approach if defense
      evasion is suspected.

  - id: GT-007-014
    branch: forensics
    category: lateral_movement
    must_have:
      hostname_in: ["MAC-DESIGNER", "WIN-MARKETING"]
      detection_type: smb_lateral
    must_not_appear: true
    rationale: |
      No lateral movement occurred between these hosts in this scenario.
      Both were independently compromised via the same C2 domain (likely
      drive-by from a shared phishing campaign). Reporting host-to-host
      lateral movement would be inferring something not in evidence.

  # ──────────────────────────────────────────────────────────────────
  # Velociraptor manifest discipline
  # ──────────────────────────────────────────────────────────────────

  - id: GT-007-015
    branch: forensics
    category: process_discipline
    must_have:
      finding_type: collection_manifest_parsed
      tool_used: "parse_collection"
      collections_inventoried: ["EVID-007A", "EVID-007B"]
    rationale: |
      Both Velociraptor collections must have been opened via parse_collection
      before any vr_extract_* call. This finding records that the agent
      followed the workflow rather than blindly invoking extractors. The
      audit log should show parse_collection EXEC entries preceding any
      vr_extract_* EXEC for each collection_id.
    confidence_floor: 0.95

expected_iocs:
  domains:
    - "update.adobefonts-cdn.example.invalid"
  file_paths:
    - "/Users/dmartin/Library/LaunchAgents/com.adobe.fonts.helper.plist"
    - "/Users/dmartin/Library/Application Support/.afh/helper"
    - "C:\\ProgramData\\AdobeFonts\\helper.exe"
  ip_ranges:
    - "198.51.100.0/24"
  vr_artifacts_referenced:
    - "MacOS.System.Persistence"
    - "MacOS.UnifiedLogs.Search"
    - "MacOS.System.KnowledgeC"
    - "MacOS.Applications.Safari.History"
    - "Windows.System.TaskScheduler"
    - "Windows.Applications.Chrome.History"
