case_id: 002-insider-threat-disk-mem
scenario: |
  Disgruntled departing employee staging proprietary data for exfiltration over
  three days. Disk image + memory capture from the user's workstation. The
  employee used legitimate corporate tools (no malware), making this a pure
  behavioral analysis case. Tests the swarm's ability to find evil that
  doesn't trigger malware signatures.

evidence:
  - id: EVID-002A
    type: disk_image
    path: fixture/disk_image.E01
  - id: EVID-002B
    type: memory_capture
    path: fixture/memory.raw

# Insider threat cases produce a lot of legitimate-looking activity. Higher
# noise tolerance reflects this — the agent SHOULD surface a few extra things,
# but they shouldn't be wrong.
allowed_extra_findings: 8

ground_truth_findings:
  # ── Discovery (looking around for what to take) ──
  - id: GT-002-001
    branch: forensics
    category: discovery
    must_have:
      artifact_type: shellbag
      folder_path: "\\\\fileserver01\\confidential\\product-roadmap-2027"
      first_accessed_by_user: "k.harrison"
    must_have_within_tolerance:
      first_access_time:
        target: "2026-04-20T16:45:00Z"
        window_seconds: 300
    confidence_floor: 0.8

  - id: GT-002-002
    branch: forensics
    category: discovery
    must_have:
      artifact_type: shellbag
      folder_path: "\\\\fileserver01\\confidential\\customer-contracts"
      first_accessed_by_user: "k.harrison"
    confidence_floor: 0.8

  - id: GT-002-003
    branch: forensics
    category: discovery
    must_have:
      artifact_type: lnk_file
      target_path: "\\\\fileserver01\\hr\\salary-bands.xlsx"
      access_user: "k.harrison"
    rationale: |
      The user accessed an HR file outside their normal scope. This is a
      discovery indicator even though the file itself was never copied.
    confidence_floor: 0.7

  # ── Collection (staging the data) ──
  - id: GT-002-004
    branch: forensics
    category: collection
    must_have:
      artifact_type: file_creation
      destination_directory: "C:\\Users\\k.harrison\\AppData\\Local\\Temp\\backup"
      file_count_minimum: 47
    must_have_within_tolerance:
      staging_window_start:
        target: "2026-04-21T19:00:00Z"
        window_seconds: 600
    rationale: |
      User created a hidden staging directory under AppData\Local\Temp and
      copied 47 files there over a 4-hour window after business hours.
    confidence_floor: 0.85

  - id: GT-002-005
    branch: forensics
    category: collection
    must_have:
      artifact_type: archive_creation
      archive_path: "C:\\Users\\k.harrison\\AppData\\Local\\Temp\\backup\\backup_2026.7z"
      archive_format: "7z"
      password_protected: true
    confidence_floor: 0.9

  # ── Memory: process that did the staging is still resident ──
  - id: GT-002-006
    branch: memory
    category: collection
    must_have:
      artifact_type: process
      process_name: "7z.exe"
      cmdline_contains: "-p"   # password flag
      parent_process: "explorer.exe"
    must_have_within_tolerance:
      pid:
        target: 6212
        relative_error: 0
    confidence_floor: 0.9

  # ── Exfiltration (the actual movement) ──
  - id: GT-002-007
    branch: forensics
    category: exfiltration
    must_have:
      artifact_type: usb_insertion
      vendor: "SanDisk"
      product: "Extreme SSD"
      serial: "SDXSPK500G_2310CC"
    must_have_within_tolerance:
      first_insertion:
        target: "2026-04-22T08:15:00Z"
        window_seconds: 120
    confidence_floor: 0.95

  - id: GT-002-008
    branch: forensics
    category: exfiltration
    must_have:
      artifact_type: file_copy_to_external
      source_path: "C:\\Users\\k.harrison\\AppData\\Local\\Temp\\backup\\backup_2026.7z"
      destination_volume: "Extreme SSD"
    must_have_within_tolerance:
      copy_time:
        target: "2026-04-22T08:18:00Z"
        window_seconds: 60
    confidence_floor: 0.85

  # ── Defense Evasion (covering tracks) ──
  - id: GT-002-009
    branch: forensics
    category: defense_evasion
    must_have:
      artifact_type: file_deletion
      deleted_path: "C:\\Users\\k.harrison\\AppData\\Local\\Temp\\backup\\backup_2026.7z"
      deletion_method: "shift_delete"   # bypassed Recycle Bin
    confidence_floor: 0.85

  - id: GT-002-010
    branch: forensics
    category: defense_evasion
    must_have:
      artifact_type: usn_journal_entry
      file_path: "C:\\Users\\k.harrison\\AppData\\Local\\Temp\\backup\\backup_2026.7z"
      reason_flags: "FILE_DELETE,CLOSE"
    rationale: |
      Even though the file was deleted, the USN journal preserves the deletion
      record. The agent should cross-reference this against the apparent
      "missing file" to confirm what was deleted.
    confidence_floor: 0.9

  # ── Memory: deleted file still in cleartext in memory ──
  - id: GT-002-011
    branch: memory
    category: collection
    must_have:
      artifact_type: file_object_in_memory
      file_name: "backup_2026.7z"
      pid: 6212
    rationale: |
      File handle still resident in memory because process didn't fully exit.
      Cross-corroborates the disk USN entry — confirms the file existed.
    confidence_floor: 0.8

  # ── Negative case: NO command-and-control should be reported ──
  - id: GT-002-012
    branch: network
    category: command_and_control
    must_have:
      "_": "_"   # placeholder — must_not_appear means we don't expect a match
    must_not_appear: true
    rationale: |
      This is an insider threat using legitimate tools and physical exfil.
      No C2 should appear. If the swarm reports C2 here, that is a false
      positive likely caused by misinterpreting normal corporate traffic.

  # ── Negative case: NO known malware should be reported ──
  - id: GT-002-013
    branch: malware
    category: known_malware
    must_have:
      "_": "_"
    must_not_appear: true
    rationale: |
      User employed legitimate signed binaries (7z.exe, explorer.exe). No
      malware family attribution should occur. False positive here would
      indicate the malware branch is over-eager.

expected_iocs:
  file_paths:
    - "C:\\Users\\k.harrison\\AppData\\Local\\Temp\\backup\\backup_2026.7z"
    - "\\\\fileserver01\\confidential\\product-roadmap-2027"
    - "\\\\fileserver01\\confidential\\customer-contracts"
    - "\\\\fileserver01\\hr\\salary-bands.xlsx"
