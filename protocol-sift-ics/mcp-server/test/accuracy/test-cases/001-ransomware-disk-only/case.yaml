case_id: 001-ransomware-disk-only
scenario: BlackBasta-style ransomware on a single Win10 workstation. Disk image only, no memory or network capture.

evidence:
  - id: EVID-001
    type: disk_image
    path: fixture/disk_image.E01

# How many extra (unanticipated) findings to tolerate as "benign noise"
# before counting them as false positives. Real systems have noise; we
# don't want to penalize the agent for finding a genuinely odd thing
# that doesn't happen to be on our ground-truth list.
allowed_extra_findings: 5

ground_truth_findings:
  # ── Initial Access ──
  - id: GT-001
    branch: forensics
    category: initial_access
    must_have:
      artifact_type: browser_download
      filename: "invoice_overdue.pdf.exe"
      source_url: "https://billing-portal-secure.example.invalid/inv/9981"
      target_user: "j.smith"
    must_have_within_tolerance:
      download_time:
        target: "2026-04-22T14:03:11Z"
        window_seconds: 5
    confidence_floor: 0.85

  # ── Execution ──
  - id: GT-002
    branch: forensics
    category: execution
    must_have:
      artifact_type: prefetch
      executable_name: "INVOICE_OVERDUE.PDF.EXE"
    must_have_within_tolerance:
      first_run:
        target: "2026-04-22T14:03:47Z"
        window_seconds: 10
    confidence_floor: 0.9

  - id: GT-003
    branch: forensics
    category: execution
    must_have:
      artifact_type: amcache
      executable_name: "invoice_overdue.pdf.exe"
      sha1: "a1b2c3d4e5f6789012345678901234567890abcd"
    confidence_floor: 0.85

  # ── Persistence ──
  - id: GT-004
    branch: forensics
    category: persistence
    must_have:
      artifact_type: scheduled_task
      task_name: "WindowsUpdateHelper"
      executable_path: "C:\\Users\\Public\\update.exe"
    must_have_within_tolerance:
      created_at:
        target: "2026-04-22T14:35:11Z"
        window_seconds: 5
    confidence_floor: 0.9

  - id: GT-005
    branch: forensics
    category: persistence
    must_have:
      artifact_type: registry_run_key
      hive: "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run"
      value_name: "OneDriveSync"
      value_data: "C:\\Users\\j.smith\\AppData\\Local\\sync.exe"
    confidence_floor: 0.85

  # ── Defense Evasion ──
  - id: GT-006
    branch: forensics
    category: defense_evasion
    must_have:
      artifact_type: event_log
      log_name: "Security"
      event_id: 1102
      action: "log_cleared"
    must_have_within_tolerance:
      timestamp:
        target: "2026-04-22T15:10:00Z"
        window_seconds: 30
    confidence_floor: 0.95

  # ── Credential Access ──
  - id: GT-007
    branch: forensics
    category: credential_access
    must_have:
      artifact_type: prefetch
      executable_name: "MIMIKATZ.EXE"
    confidence_floor: 0.9

  # ── Discovery ──
  - id: GT-008
    branch: forensics
    category: discovery
    must_have:
      artifact_type: prefetch
      executable_name: "NET.EXE"
      run_count_minimum: 8
    confidence_floor: 0.7

  # ── Impact ──
  - id: GT-009
    branch: forensics
    category: impact
    must_have:
      artifact_type: file_creation_pattern
      pattern_type: ransomware_extension
      extension: ".basta"
      file_count_minimum: 1500
    confidence_floor: 0.95

  - id: GT-010
    branch: forensics
    category: impact
    must_have:
      artifact_type: file_creation
      filename_pattern: "readme.txt"
      content_match: "ransom_note"
    confidence_floor: 0.95

  # ── Negative Cases (must NOT appear) ──
  - id: GT-N01
    branch: forensics
    category: lateral_movement
    must_not_appear: true
    rationale: "Single-host case. Any lateral movement finding is a false positive."

  - id: GT-N02
    branch: forensics
    category: command_and_control
    must_not_appear: true
    rationale: "Disk-only evidence cannot legitimately establish C2 — would require network artifacts."

expected_iocs:
  hashes:
    - "a1b2c3d4e5f6789012345678901234567890abcd"
  registry_keys:
    - "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\OneDriveSync"
  file_paths:
    - "C:\\Users\\Public\\update.exe"
    - "C:\\Users\\j.smith\\AppData\\Local\\sync.exe"
    - "C:\\Users\\j.smith\\Downloads\\invoice_overdue.pdf.exe"
