case_id: 003-c2-network-only
scenario: |
  Cobalt Strike beacon traffic mixed with normal web browsing. PCAP only —
  no disk or memory available. Tests the Network Branch's ability to find
  C2 in the absence of corroborating disk/memory artifacts. This is the
  hardest scenario for the swarm because there is nothing to correlate
  against — no Situation Unit cross-source confirmation possible.

evidence:
  - id: EVID-003
    type: pcap
    path: fixture/traffic.pcap

allowed_extra_findings: 6

ground_truth_findings:
  # ── C2 Beacon detection ──
  - id: GT-003-001
    branch: network
    category: command_and_control
    must_have:
      detection_type: beacon
      src_ip: "10.10.50.42"
      dst_ip: "198.51.100.77"
      dst_port: 443
      protocol: "tls"
    must_have_within_tolerance:
      beacon_interval_seconds:
        target: 60
        relative_error: 0.15   # CS jitter typically ±10%
    confidence_floor: 0.85

  - id: GT-003-002
    branch: network
    category: command_and_control
    must_have:
      detection_type: ja3_fingerprint_known_bad
      ja3: "72a589da586844d7f0818ce684948eea"
      ja3_attribution: "cobalt_strike_default_profile"
      src_ip: "10.10.50.42"
    confidence_floor: 0.9

  - id: GT-003-003
    branch: network
    category: command_and_control
    must_have:
      detection_type: suspicious_certificate
      dst_ip: "198.51.100.77"
      cert_self_signed: true
      cert_subject_random: true   # CN looks like base64 / random
    confidence_floor: 0.7

  # ── DNS tunneling (a secondary channel) ──
  - id: GT-003-004
    branch: network
    category: command_and_control
    must_have:
      detection_type: dns_tunneling
      src_ip: "10.10.50.42"
      query_domain_suffix: ".lookup.exfildata.example.invalid"
      anomaly: "high_subdomain_entropy"
    must_have_within_tolerance:
      query_volume_per_minute:
        target: 22
        relative_error: 0.25
    confidence_floor: 0.8

  # ── Recon traffic ──
  - id: GT-003-005
    branch: network
    category: discovery
    must_have:
      detection_type: internal_port_scan
      src_ip: "10.10.50.42"
      target_subnet: "10.10.50.0/24"
      ports_scanned_minimum: 18
    must_have_within_tolerance:
      scan_window_start:
        target: "2026-04-22T15:30:00Z"
        window_seconds: 600
    confidence_floor: 0.85

  # ── Lateral movement attempt over SMB ──
  - id: GT-003-006
    branch: network
    category: lateral_movement
    must_have:
      detection_type: smb_lateral
      src_ip: "10.10.50.42"
      dst_ip: "10.10.50.71"
      dst_port: 445
      smb_command: "TREE_CONNECT_ADMIN_SHARE"   # ADMIN$ access
    confidence_floor: 0.9

  # ── Exfiltration ──
  - id: GT-003-007
    branch: network
    category: exfiltration
    must_have:
      detection_type: large_outbound_transfer
      src_ip: "10.10.50.42"
      dst_ip: "198.51.100.77"
      protocol: "https"
    must_have_within_tolerance:
      bytes_transferred:
        target: 47000000   # ~47 MB
        relative_error: 0.10
      transfer_window_minutes:
        target: 12
        relative_error: 0.30
    confidence_floor: 0.7

  # ── Triage finding (top talker) ──
  - id: GT-003-008
    branch: triage
    category: anomalous_network
    must_have:
      finding_type: top_external_talker
      internal_ip: "10.10.50.42"
      external_ip: "198.51.100.77"
    confidence_floor: 0.6

  # ── Negative case: NO disk-based persistence should appear ──
  - id: GT-003-009
    branch: forensics
    category: persistence
    must_have:
      "_": "_"
    must_not_appear: true
    rationale: |
      No disk image was provided. If a forensics finding appears, it is
      hallucinated.

  # ── Negative case: NO memory findings should appear ──
  - id: GT-003-010
    branch: memory
    category: suspicious_process
    must_have:
      "_": "_"
    must_not_appear: true
    rationale: |
      No memory capture was provided. Any memory branch finding is hallucinated.

  # ── Negative case: should NOT misattribute to a specific named APT group ──
  - id: GT-003-011
    branch: network
    category: command_and_control
    must_have:
      attribution: "APT29"   # specific named group
    must_not_appear: true
    confidence_floor: 0.0
    rationale: |
      Cobalt Strike is used by hundreds of actors. Specific APT attribution
      from a single PCAP is not justifiable. The agent should report "Cobalt
      Strike beacon" without naming a specific group.

  # ── A "tricky" case: a benign DNS query that LOOKS like tunneling ──
  - id: GT-003-012
    branch: network
    category: anomalous_network
    must_have:
      detection_type: chrome_safe_browsing_check
      query_domain: "safebrowsing.googleapis.com"
      classified_as: "benign"
    rationale: |
      Chrome's Safe Browsing service generates frequent DNS queries to
      googleapis.com that share statistical features with DNS tunneling
      (high frequency, varied subdomains). The agent should NOT flag this
      as malicious. If it does, that's a false positive on the C2 category
      (covered by GT-003-004 not matching this).

expected_iocs:
  ips:
    - "198.51.100.77"
    - "10.10.50.42"
    - "10.10.50.71"
  domains:
    - "lookup.exfildata.example.invalid"
